name: Cleanup merged cursor branches

on:
  schedule:
    # Weekly Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged cursor/* branches with no open PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "main";

            core.info(`Listing remote branches matching cursor/*…`);

            const branches = [];
            let page = 1;
            while (true) {
              const { data } = await github.rest.repos.listBranches({
                owner,
                repo,
                per_page: 100,
                page,
              });
              if (data.length === 0) break;
              for (const b of data) {
                if (b.name.startsWith("cursor/") && b.name !== base) {
                  branches.push(b.name);
                }
              }
              if (data.length < 100) break;
              page += 1;
            }

            core.info(`Found ${branches.length} cursor/* branch(es).`);

            let deleted = 0;
            let skipped = 0;

            for (const branch of branches) {
              // Open PRs with this head branch (any base)
              const { data: openPrs } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:${branch}`,
                per_page: 10,
              });

              if (openPrs.length > 0) {
                core.info(`Skip ${branch}: open PR #${openPrs.map((p) => p.number).join(", ")}`);
                skipped += 1;
                continue;
              }

              // Fully merged into main?
              let comparison;
              try {
                const res = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${base}...${branch}`,
                });
                comparison = res.data;
              } catch (err) {
                core.warning(`Skip ${branch}: compare failed (${err.message})`);
                skipped += 1;
                continue;
              }

              // ahead_by === 0 means every commit on the branch is in main
              if (comparison.ahead_by !== 0) {
                core.info(
                  `Skip ${branch}: not fully merged into ${base} (ahead_by=${comparison.ahead_by})`,
                );
                skipped += 1;
                continue;
              }

              core.info(`Deleting ${branch} (merged into ${base}, no open PR)…`);
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                deleted += 1;
              } catch (err) {
                core.warning(`Failed to delete ${branch}: ${err.message}`);
                skipped += 1;
              }
            }

            core.info(`Done. Deleted ${deleted}, skipped ${skipped}.`);
