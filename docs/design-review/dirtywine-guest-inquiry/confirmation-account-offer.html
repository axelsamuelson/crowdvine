<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tack för din förfrågan — account offer</title>
  <style>
    :root { color-scheme: light; --fg:#111; --muted:#71717a; --border:#e4e4e7; --bg:#fff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--fg); background:var(--bg); }
    .wrap { max-width: 32rem; margin: 0 auto; padding: 3rem 1rem; display: grid; gap: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    .privacy { font-size: 0.875rem; }
    .privacy a { color: inherit; }
    .primary, .outline { width: 100%; height: 3rem; border-radius: 0.375rem; font: inherit; font-weight: 500; cursor: pointer; }
    .primary { border: 0; background: #111; color: #fff; }
    .outline { border: 1px solid var(--border); background: #fff; color: #111; }
    .login { text-align: center; font-size: 0.875rem; color: var(--muted); }
    .login a { color: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tack för din förfrågan</h1>
    <p>Vi återkommer med bekräftelse och faktura inom 1 arbetsdag.</p>
    <p class="privacy">Vi behandlar dina uppgifter för att hantera förfrågan. Läs mer i vår <a href="#">integritetspolicy</a>.</p>
    <button class="primary" type="button">Skapa konto för att spara förfrågan</button>
    <button class="outline" type="button">Fortsätt utan konto</button>
    <p class="login"><a href="#">Logga in</a></p>
  </div>
</body>
</html>
