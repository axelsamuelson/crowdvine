<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Beställningsförfrågan | Dirtywine (1× Résiste @ 132)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f0f0f0;color:#0a0a0a;min-height:100vh}
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:1rem;background:#f0f0f0}
.menu{font-size:12px;font-weight:600;text-transform:uppercase;background:rgba(0,0,0,.06);border:0;border-radius:4px;padding:.4rem .75rem}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:700;letter-spacing:.12em;font-size:14px}
.cart{background:#000;color:#fff;font-size:12px;font-weight:600;border:0;border-radius:4px;padding:.35rem .55rem}
main{padding:5.5rem 1rem 3rem;max-width:42rem;margin:0 auto}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin:0 0 .5rem}
.intro{color:#71717a;margin:0 0 1.5rem;line-height:1.5}
h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:#71717a;font-weight:500;margin:0 0 .75rem}
ul{list-style:none;margin:0 0 1.5rem;padding:0;border:1px solid #e4e4e7;border-radius:.375rem;background:#fff;overflow:hidden}
li{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;padding:.7rem .85rem;font-size:.875rem;border-top:1px solid #e4e4e7}
li:first-child{border-top:none}
.left{min-width:0;flex:1}
.qty{margin-top:2px;font-size:13px;color:#71717a;line-height:1.35}
.price{white-space:nowrap;padding-left:16px;flex-shrink:0;font-variant-numeric:tabular-nums}
.total .left>div:first-child,.total .price{font-weight:500}
.btn{display:block;text-align:center;text-decoration:none;background:#171717;color:#fafafa;padding:.9rem 1rem;border-radius:.375rem;font-weight:500;margin-bottom:.75rem}
.btn-outline{display:block;text-align:center;text-decoration:none;border:1px solid #d4d4d8;color:#0a0a0a;padding:.75rem 1rem;border-radius:.375rem}
</style>
</head>
<body>
<header>
  <button class="menu" type="button">Meny</button>
  <div class="logo">DIRTY WINE</div>
  <button class="cart" type="button">Varukorg (1)</button>
</header>
<main>
  <h1>Beställningsförfrågan</h1>
  <p class="intro">Skicka en förfrågan för vinerna i din varukorg. Vi återkommer med bekräftelse och faktura — ingen betalning sker här.</p>
  <h2>Din förfrågan</h2>
  <ul>
    <li>
      <div class="left"><div>Résiste 2025</div><div class="qty">1 flaska</div></div>
      <div class="price">132 kr</div>
    </li>
    <li class="total">
      <div class="left"><div>Totalt</div><div class="qty">1 flaska</div></div>
      <div class="price">132 kr <span style="font-weight:400;color:#71717a;font-size:12px">exkl. moms</span></div>
    </li>
  </ul>
  <a class="btn" href="#">Skicka förfrågan</a>
  <a class="btn-outline" href="#">Tillbaka till sortimentet</a>
</main>
</body>
</html>
