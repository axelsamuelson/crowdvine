<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beställningsförfrågan — Résiste 132</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: hsl(223.81 0% 94%);
      --fg: hsl(223.81 0% 4%);
      --muted: hsl(223.81 0% 45%);
      --border: hsl(223.81 0% 74%);
      --card: #fff;
      --primary: hsl(223.81 0% 9%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: var(--bg);
    }
    .menu {
      position: relative;
      z-index: 1;
      border: 0;
      background: color-mix(in srgb, var(--border) 55%, white);
      padding: 0.4rem 0.75rem;
      border-radius: 0.25rem;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .logo-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      max-width: 46vw;
      z-index: 0;
    }
    .logo-wrap img {
      height: 24px;
      max-height: 24px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }
    .cart {
      position: relative;
      z-index: 1;
      min-width: 2.25rem;
      height: 2.25rem;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0 0.55rem;
    }
    .wrap { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1rem 3rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
    .intro { color: var(--muted); margin: 0 0 2rem; line-height: 1.5; }
    h2 { font-size: 0.875rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 0.75rem; }
    .summary { border: 1px solid var(--border); border-radius: 0.375rem; margin-bottom: 2rem; background: var(--card); padding: 0; list-style: none; }
    .summary li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.625rem 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.875rem;
      align-items: flex-start;
    }
    .summary li:first-child { border-top: 0; }
    .summary .row-main { display: flex; gap: 0.75rem; align-items: flex-start; min-width: 0; flex: 1; }
    .summary .thumb {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 0.125rem;
      flex-shrink: 0;
      background: color-mix(in srgb, var(--border) 40%, white);
    }
    .summary .muted { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .summary .total { font-weight: 500; }
    .summary .price { white-space: nowrap; padding-left: 1rem; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    form { display: grid; gap: 1rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
    .span2 { grid-column: span 2; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; grid-column: span 2; }
    label { display: block; font-size: 0.875rem; margin-bottom: 0.375rem; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      font: inherit;
      background: #fff;
    }
    .privacy { font-size: 0.875rem; color: var(--muted); }
    .privacy a { color: inherit; }
    button.submit {
      width: 100%; height: 3rem; border: 0; border-radius: 0.375rem;
      background: var(--primary); color: #fff; font: inherit; font-weight: 500;
    }
  </style>
</head>
<body>
  <header>
    <button class="menu" type="button">Meny</button>
    <div class="logo-wrap">
      <img src="https://abrnvjqwpdkodgrtezeg.supabase.co/storage/v1/object/public/uploads/fe06af9d-ee01-418b-8b77-9d1b0c435bac.svg" alt="Dirtywine" />
    </div>
    <div class="cart">(1)</div>
  </header>
  <div class="wrap">
    <h1>Beställningsförfrågan</h1>
    <p class="intro">Vi återkommer med bekräftelse och faktura. Ingen betalning sker här.</p>
    <section>
      <h2>Din förfrågan</h2>
      <ul class="summary">
        <li>
          <div class="row-main">
            <img class="thumb" width="40" height="40" alt=""
              src="https://abrnvjqwpdkodgrtezeg.supabase.co/storage/v1/object/public/uploads/ccfe951f-30a9-42d8-b7c7-e8b2bbde67b1.webp" />
            <div>
              <div>Résiste 2025</div>
              <div class="muted">1 flaska</div>
            </div>
          </div>
          <span class="price">132 kr</span>
        </li>
        <li class="total">
          <div>
            <div>Totalt</div>
            <div class="muted">1 flaska</div>
          </div>
          <span class="price">132 kr <span class="muted" style="font-weight:400;font-size:12px">exkl. moms</span></span>
        </li>
      </ul>
    </section>
    <form lang="sv">
      <div class="grid">
        <div class="span2"><label>Företag / restaurang</label><input autocomplete="organization" value="" /></div>
        <div><label>Organisationsnummer</label><input inputmode="numeric" value="" /></div>
        <div><label>Kontaktperson</label><input autocomplete="name" value="" /></div>
        <div><label>E-post</label><input type="email" autocomplete="email" value="" /></div>
        <div><label>Telefon (valfritt)</label><input type="tel" autocomplete="tel" value="" /></div>
        <div class="span2"><label>Leveransadress</label><input autocomplete="street-address" value="" /></div>
        <div class="row2">
          <div><label>Postnummer</label><input inputmode="numeric" autocomplete="postal-code" value="" /></div>
          <div><label>Ort</label><input autocomplete="address-level2" value="" /></div>
        </div>
        <div class="span2"><label for="desired-date">Önskat leveransdatum (valfritt)</label><input id="desired-date" type="date" lang="sv-SE" min="2026-11-02" value="" /></div>
        <div class="span2"><label>Meddelande (valfritt)</label><textarea rows="4" placeholder="Eventuella önskemål eller frågor"></textarea></div>
      </div>
      <p class="privacy">Vi behandlar dina uppgifter för att hantera förfrågan. Läs mer i vår <a href="#">integritetspolicy</a>.</p>
      <button class="submit" type="button">Skicka förfrågan</button>
    </form>
  </div>
</body>
</html>
