<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Varukorg — Résiste 132</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: hsl(223.81 0% 94%);
      --fg: hsl(223.81 0% 4%);
      --muted: hsl(223.81 0% 45%);
      --border: hsl(223.81 0% 74%);
      --card: #fff;
      --primary: hsl(223.81 0% 9%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
      min-height: 100vh;
    }
    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: var(--bg);
    }
    .menu {
      position: relative;
      z-index: 1;
      border: 0;
      background: color-mix(in srgb, var(--border) 55%, white);
      padding: 0.4rem 0.75rem;
      border-radius: 0.25rem;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .logo-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      max-width: 46vw;
    }
    .logo-wrap img {
      height: 24px;
      max-height: 24px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }
    .cart-btn {
      position: relative;
      z-index: 1;
      min-width: 2.25rem;
      height: 2.25rem;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0 0.55rem;
    }
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.28);
      z-index: 40;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(100%, 28rem);
      background: #fafafa;
      z-index: 50;
      display: flex;
      flex-direction: column;
      box-shadow: -12px 0 40px rgba(0,0,0,.12);
    }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0.75rem 0.75rem;
    }
    .drawer-head h1 {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .close {
      border: 0;
      background: transparent;
      font-size: 1.25rem;
      line-height: 1;
      padding: 0.25rem 0.5rem;
    }
    .item {
      display: flex;
      gap: 1.25rem;
      padding: 0.75rem;
      background: #fff;
      margin: 0 0.75rem;
      border-radius: 0.5rem;
    }
    .thumb {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 0.25rem;
      flex-shrink: 0;
      background: #eee;
    }
    .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.35rem; }
    .title { font-size: 1.05rem; font-weight: 600; }
    .producer { font-size: 0.875rem; color: var(--muted); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 0.375rem;
      background: #f4f4f5;
      color: var(--muted);
      width: fit-content;
    }
    .price { font-size: 1.125rem; font-weight: 600; }
    .excl { font-size: 10px; color: var(--muted); }
    .qty-row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .stepper {
      display: flex;
      align-items: center;
      height: 2rem;
      border: 1px solid #e4e4e7;
      border-radius: 0.375rem;
    }
    .stepper button { width: 2rem; border: 0; background: transparent; font-size: 1rem; }
    .stepper span { width: 2rem; text-align: center; font-size: 0.875rem; }
    .foot {
      margin-top: auto;
      padding: 1rem 0.75rem 1.25rem;
      border-top: 1px solid #e4e4e7;
      background: #fafafa;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 0.75rem;
    }
    .total-right { text-align: right; }
    .cta {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--primary);
      color: #fff;
      padding: 0.9rem 1rem;
      border-radius: 0.375rem;
      font-weight: 500;
      text-decoration: none;
      border: 0;
      font: inherit;
    }
  </style>
</head>
<body>
  <header>
    <button class="menu" type="button">Meny</button>
    <div class="logo-wrap">
      <img src="https://abrnvjqwpdkodgrtezeg.supabase.co/storage/v1/object/public/uploads/fe06af9d-ee01-418b-8b77-9d1b0c435bac.svg" alt="Dirtywine" />
    </div>
    <div class="cart-btn">(1)</div>
  </header>
  <div class="backdrop"></div>
  <aside class="drawer" aria-label="Varukorg">
    <div class="drawer-head">
      <h1>Varukorg</h1>
      <button class="close" type="button" aria-label="Stäng">×</button>
    </div>
    <div class="item">
      <img class="thumb" width="240" height="240" alt="Résiste 2025"
        src="https://abrnvjqwpdkodgrtezeg.supabase.co/storage/v1/object/public/uploads/ccfe951f-30a9-42d8-b7c7-e8b2bbde67b1.webp" />
      <div class="meta">
        <div class="title">Résiste 2025</div>
        <div class="producer">La Marotte</div>
        <span class="badge">Lager</span>
        <div class="price">132&nbsp;kr</div>
        <div class="excl">exkl. moms</div>
        <div class="qty-row">
          <div class="stepper">
            <button type="button">−</button>
            <span>1</span>
            <button type="button">+</button>
          </div>
        </div>
      </div>
    </div>
    <div class="foot">
      <div class="total-row">
        <span>Totalt</span>
        <div class="total-right">
          <div>132&nbsp;kr</div>
          <div class="excl">exkl. moms</div>
        </div>
      </div>
      <button class="cta" type="button">Skicka förfrågan</button>
    </div>
  </aside>
</body>
</html>
