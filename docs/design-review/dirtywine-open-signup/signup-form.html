<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: hsl(223.81 0% 94%);
      --fg: hsl(223.81 0% 4%);
      --muted: hsl(223.81 0% 45%);
      --border: hsl(223.81 0% 74%);
      --card: #fff;
      --primary: hsl(223.81 0% 9%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: var(--bg);
    }
    .menu {
      position: relative;
      z-index: 1;
      border: 0;
      background: color-mix(in srgb, var(--border) 55%, white);
      padding: 0.4rem 0.75rem;
      border-radius: 0.25rem;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .logo-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      max-width: 46vw;
      z-index: 0;
    }
    .logo-wrap img {
      height: 24px;
      max-height: 24px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }
    .cart {
      position: relative;
      z-index: 1;
      min-width: 2.25rem;
      height: 2.25rem;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0 0.55rem;
    }
    .wrap {
      max-width: 28rem;
      margin: 0 auto;
      padding: 3.5rem 1rem 3rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .intro {
      color: var(--muted);
      margin: 0 0 1.75rem;
      line-height: 1.5;
      text-align: center;
      font-size: 0.875rem;
    }
    form { display: grid; gap: 1rem; }
    label { display: block; font-size: 0.875rem; margin-bottom: 0.375rem; font-weight: 500; }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.625rem 0.75rem;
      font: inherit;
      background: #fff;
    }
    button.submit {
      width: 100%;
      height: 3rem;
      border: 0;
      border-radius: 0.375rem;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 500;
      margin-top: 0.25rem;
    }
    .signin {
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 1.25rem;
    }
    .signin a { color: var(--fg); }
  </style>
</head>
<body>
  <header>
    <button class="menu" type="button">Meny</button>
    <div class="logo-wrap">
      <img src="https://abrnvjqwpdkodgrtezeg.supabase.co/storage/v1/object/public/uploads/fe06af9d-ee01-418b-8b77-9d1b0c435bac.svg" alt="Dirtywine" />
    </div>
    <div class="cart">(0)</div>
  </header>
  <div class="wrap">
    <h1>Skapa konto</h1>
    <p class="intro">Spara dina förfrågningar och fakturor på ett ställe.</p>
    <form>
      <div>
        <label for="full_name">Namn</label>
        <input id="full_name" name="full_name" type="text" placeholder="Ditt namn eller företagsnamn" />
      </div>
      <div>
        <label for="email">E-postadress</label>
        <input id="email" name="email" type="email" placeholder="Ange din e-post" />
      </div>
      <div>
        <label for="password">Lösenord</label>
        <input id="password" name="password" type="password" placeholder="Skapa ett lösenord" />
      </div>
      <div>
        <label for="confirm">Bekräfta lösenord</label>
        <input id="confirm" name="confirm" type="password" placeholder="Bekräfta ditt lösenord" />
      </div>
      <button class="submit" type="button">Skapa konto</button>
    </form>
    <p class="signin">Har du redan ett konto? <a href="/log-in?next=%2Fb2b%2Finquiry">Logga in</a></p>
  </div>
</body>
</html>
